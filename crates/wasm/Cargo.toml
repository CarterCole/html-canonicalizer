[package]
name = "canon-wasm"
description = "WebAssembly binding of canon-core, for running the canonicalizer inside a page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canon-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Must match the wasm-bindgen CLI that generates the JS glue exactly (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
