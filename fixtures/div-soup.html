<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Div soup card</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; font-family: Helvetica, Arial, sans-serif; background: #f3f4f6; color: #1f2937; }
  .outer-wrapper { max-width: 420px; }
  .card-container { position: relative; }
  .card { background: #fff; border: 1px solid #d1d5db; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); overflow: hidden; }
  .card__inner { padding: 20px; }
  .card__content-wrapper { display: flex; flex-direction: column; gap: 12px; }
  .card__header { display: flex; align-items: center; justify-content: space-between; }
  .card__title-wrap { min-width: 0; }
  .card__title { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; }
  .badge-wrap { flex-shrink: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; line-height: 18px; font-weight: 600; }
  .card__body p { margin: 0; font-size: 14px; line-height: 21px; color: #4b5563; }
  .card__footer { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none; }
  .btn--primary { background: #2563eb; color: #fff; }
  .btn--ghost { color: #2563eb; border: 1px solid #bfdbfe; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="outer-wrapper" id="root">
  <div class="card-container">
    <div class="card">
      <div class="card__inner">
        <div class="card__content-wrapper">
          <div class="card__header">
            <div class="card__title-wrap">
              <div>
                <h3 class="card__title"><span><span>Quarterly report</span></span></h3>
              </div>
            </div>
            <div class="badge-wrap"><span class="badge"><span>On track</span></span></div>
          </div>
          <div class="card__body">
            <div>
              <div>
                <p>Revenue grew <b>14%</b> over the <i>previous</i> quarter, driven mostly by <a href="#" style="color:#2563eb">renewals</a> in the enterprise tier.</p>
              </div>
            </div>
          </div>
          <div class="card__footer">
            <div><a class="btn btn--primary" href="#"><span>Open report</span></a></div>
            <div><a class="btn btn--ghost" href="#"><span>Share</span></a></div>
            <div class="hidden"><a class="btn" href="#">Delete</a></div>
          </div>
          <span class="sr-only">End of card</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
